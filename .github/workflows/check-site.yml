name: Check companion website
on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/check_site.py'
      - '.github/workflows/check-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check_site.py'
      - '.github/workflows/check-site.yml'
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate internal links and HTML page structure
        run: python scripts/check_site.py
